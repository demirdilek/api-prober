# prom-stack-values.yaml

# Deactivate the Node Exporter, as it is not needed for this setup and can cause unnecessary alerts in K3d environments.
nodeExporter:
  enabled: false

# Pro-Tipp: In K3d, the kube-controller-manager, kube-scheduler, and kube-proxy components are often not scrapeable from outside and can trigger TargetDown alerts. Therefore, they are disabled in this configuration.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  grafana.ini:
    dashboards:
      # Force Grafana to use the dashboard as the default home screen
      default_home_dashboard_path: "/tmp/dashboards/api_prober_dashboard.json"

alertmanager:
  alertmanagerSpec:
    secrets:
      - pushover-credentials
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: pushover
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Intercept the Watchdog alert and send it to the null receiver
        - matchers:
            - alertname = Watchdog
          receiver: 'null'
    receivers:
      - name: pushover
        pushover_configs:
          # Mount secrets injected via Kubernetes Secret pushover-credentials)
          - user_key_file: /etc/alertmanager/secrets/pushover-credentials/USER_KEY
            token_file: /etc/alertmanager/secrets/pushover-credentials/APP_TOKEN
            send_resolved: true
      - name: 'null'