# ==============================================================================
# Prometheus Stack Configuration Template
# SRE 4 Golden Signals, Multi-Channel Alerting & Actionable Diagnostics
# ==============================================================================

alertmanager:
  config:
    global:
      resolve_timeout: 5m

    # --------------------------------------------------------------------------
    # Alert Routing Tree
    # --------------------------------------------------------------------------
    route:
      receiver: 'slack-notifications'
      group_by: ['alertname', 'severity', 'category']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 12h
      routes:
        # Suppress Prometheus internal watchdog alert
        - matchers:
            - alertname = Watchdog
          receiver: 'null'

        # Route 1: Critical alerts trigger immediate Pushover notification (Priority 1)
        # continue: true allows critical alerts to also flow into Slack
        - matchers:
            - severity = critical
          receiver: 'pushover-notifications'
          continue: true

        # Route 2: All severity levels (info, warning, critical) flow into Slack
        - matchers:
            - severity =~ "info|warning|critical"
          receiver: 'slack-notifications'

    # --------------------------------------------------------------------------
    # Receivers & Notification Channels
    # --------------------------------------------------------------------------
    receivers:
      - name: 'null'

      # Slack Receiver (Dynamic SRE Alert Template)
      - name: 'slack-notifications'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
            send_resolved: true
            title: '{{ if eq .Status "firing" }}:warning: [{{ .CommonLabels.severity | toUpper }}]{{ else }}:white_check_mark: [RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
            text: >-
              <!here>
              *Time:* {{ (index .Alerts 0).StartsAt.Format "15:04:05 MST" }}
              {{ if .CommonAnnotations.summary }}*Summary:* {{ .CommonAnnotations.summary }}{{ end }}
              {{ if .CommonLabels.category }}*Error Category:* `{{ .CommonLabels.category }}`{{ end }}
              {{ if .CommonAnnotations.description }}*Description:* {{ .CommonAnnotations.description }}{{ end }}
              {{ if .CommonAnnotations.hint }}
              *Actionable Diagnostic Hint:*
              > {{ .CommonAnnotations.hint }}
              {{ end }}

      # Pushover Receiver (High-Priority Mobile Push)
      - name: 'pushover-notifications'
        pushover_configs:
          - user_key: 'YOUR_PUSHOVER_USER_KEY'
            token: 'YOUR_PUSHOVER_API_TOKEN'
            priority: '1' # Priority 1 bypasses hardware silent switches on mobile devices
            sound: 'alien'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ if .CommonLabels.category }}{{ .CommonLabels.category }}{{ else }}system{{ end }})'
            message: |-
              Summary: {{ .CommonAnnotations.summary }}
              
              Hint: {{ .CommonAnnotations.hint }}

# ------------------------------------------------------------------------------
# Prometheus Custom Alert Rules (SRE Golden Signals & Actionable Hints)
# ------------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    additionalPrometheusRulesMap:
      kube-prober-rules:
        groups:
          - name: kube-prober.rules
            rules:
              # --- 1. High Error Rate / Unreachable Target (Critical) ---
              - alert: HighErrorRate
                expr: rate(probe_success{job="kube-prober"}[2m]) == 0
                for: 1m
                labels:
                  severity: critical
                  category: http_error
                annotations:
                  summary: "Probe Target Unreachable or Returning 5xx Error"
                  description: "Target {{ $labels.instance }} failed probes continuously for over 1 minute."
                  hint: "Run 'kubectl logs -n {{ $labels.namespace }} -l app={{ $labels.service }}' to check for application panics or HTTP 5xx crash loops."

              # --- 2. High Latency (Warning) ---
              - alert: HighLatency
                expr: histogram_quantile(0.99, sum(rate(probe_duration_seconds_bucket{job="kube-prober"}[5m])) by (le, instance)) > 1.0
                for: 2m
                labels:
                  severity: warning
                  category: timeout
                annotations:
                  summary: "Target p99 Probe Latency Exceeds 1s"
                  description: "Target {{ $labels.instance }} p99 latency is currently {{ $value | printf \"%.2f\" }}s."
                  hint: "Inspect CPU/Memory utilization via 'kubectl top pods -n {{ $labels.namespace }}'. Look for database lock contention or CPU throttling."

              # --- 3. DNS Resolution Failure (Critical) ---
              - alert: TargetDNSFailure
                expr: probe_dns_lookup_failed{job="kube-prober"} == 1
                for: 1m
                labels:
                  severity: critical
                  category: dns_error
                annotations:
                  summary: "DNS Resolution Failed for Probed Endpoint"
                  description: "kube-prober was unable to resolve hostname for target {{ $labels.instance }}."
                  hint: "Check CoreDNS health using 'kubectl get pods -n kube-system -l k8s-app=kube-dns'. Verify target Service/ExternalName configuration."

              # --- 4. Connection Refused (Critical) ---
              - alert: TargetConnectionRefused
                expr: probe_failed_due_to_connection_refused{job="kube-prober"} == 1
                for: 1m
                labels:
                  severity: critical
                  category: connection_refused
                annotations:
                  summary: "Connection Refused by Target Port"
                  description: "Target {{ $labels.instance }} actively refused TCP connection."
                  hint: "Verify if the container process is bound to the correct port or if network policies are blocking traffic."

              # --- 5. TLS Handshake Failure (Warning) ---
              - alert: TargetTLSError
                expr: probe_tls_handshake_failed{job="kube-prober"} == 1
                for: 1m
                labels:
                  severity: warning
                  category: tls_error
                annotations:
                  summary: "TLS/SSL Handshake Failed"
                  description: "kube-prober encountered a TLS handshake error when connecting to {{ $labels.instance }}."
                  hint: "Check certificate expiration and issuer trust chain via 'openssl s_client -connect {{ $labels.instance }}:443'."