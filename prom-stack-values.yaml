# prom-stack-values.yaml

# Deactivate the Node Exporter, as it is not needed for this setup and can cause unnecessary alerts in K3d environments.
nodeExporter:
  enabled: false

# Pro-Tipp: In K3d, the kube-controller-manager, kube-scheduler, and kube-proxy components are often not scrapeable from outside and can trigger TargetDown alerts. Therefore, they are disabled in this configuration.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  grafana.ini:
    dashboards:
      # Force Grafana to use the dashboard as the default home screen
      default_home_dashboard_path: "/tmp/dashboards/kube_prober_dashboard.json"

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      # Default receiver for all alerts
      receiver: 'slack-notifications'
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 12h
      routes:
        - matchers:
            - alertname = Watchdog
          receiver: 'null'

        # Sub-route: Critical alerts also trigger Pushover without blocking Slack
        - matchers:
            - severity = critical
          receiver: 'pushover-notifications'
          continue: true

    receivers:
      - name: 'null'

      - name: 'slack-notifications'
        slack_configs:
          - api_url: 'YOUR_SLACK_WEBHOOK_URL'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              <!here>

              *Time:* {{ (index .Alerts 0).StartsAt.Format "15:04:05 MST" }}

              *Summary:* {{ .CommonAnnotations.summary }}

      - name: 'pushover-notifications'
        pushover_configs:
          - user_key: 'YOUR_PUSHOVER_USER_KEY'
            token: 'YOUR_PUSHOVER_API_TOKEN'
            priority: '1' # Priority 1 bypasses silent mode on mobile devices
            sound: 'alien'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            message: '{{ .CommonAnnotations.summary }}'