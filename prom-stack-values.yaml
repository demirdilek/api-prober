# ==============================================================================
# Prometheus Stack Configuration Template
# SRE 4 Golden Signals, Multi-Channel Alerting & Actionable Diagnostics
# ==============================================================================

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m

    # --------------------------------------------------------------------------
    # Alert Routing Tree
    # --------------------------------------------------------------------------
    route:
      receiver: 'slack-notifications'
      group_by: ['alertname', 'severity', 'category']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 12h
      routes:
        # Suppress Prometheus internal watchdog alert
        - matchers:
            - alertname = Watchdog
          receiver: 'null'

        # Route 1: Critical alerts trigger immediate Pushover notification (Priority 1)
        # continue: true allows critical alerts to also flow into Slack
        - matchers:
            - severity = critical
          receiver: 'pushover-notifications'
          continue: true

        # Route 2: All severity levels (info, warning, critical) flow into Slack
        - matchers:
            - severity =~ "info|warning|critical"
          receiver: 'slack-notifications'

    # --------------------------------------------------------------------------
    # Receivers & Notification Channels
    # --------------------------------------------------------------------------
    receivers:
      - name: 'null'

      # Slack Receiver (Dynamic SRE Alert Template)
      - name: 'slack-notifications'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
            send_resolved: true
            title: '{{ if eq .Status "firing" }}:warning: [{{ .CommonLabels.severity | toUpper }}]{{ else }}:white_check_mark: [RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
            text: >-
              <!here>
              *Time:* {{ (index .Alerts 0).StartsAt.Format "15:04:05 MST" }}
              {{ if .CommonAnnotations.summary }}*Summary:* {{ .CommonAnnotations.summary }}{{ end }}
              {{ if .CommonLabels.category }}*Error Category:* `{{ .CommonLabels.category }}`{{ end }}
              {{ if .CommonAnnotations.description }}*Description:* {{ .CommonAnnotations.description }}{{ end }}
              {{ if .CommonAnnotations.hint }}
              *Actionable Diagnostic Hint:*
              > {{ .CommonAnnotations.hint }}
              {{ end }}

      # Pushover Receiver (High-Priority Mobile Push)
      - name: 'pushover-notifications'
        pushover_configs:
          - user_key: 'YOUR_PUSHOVER_USER_KEY'
            token: 'YOUR_PUSHOVER_API_TOKEN'
            priority: '1' # Priority 1 bypasses hardware silent switches on mobile devices
            sound: 'alien'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ if .CommonLabels.category }}{{ .CommonLabels.category }}{{ else }}system{{ end }})'
            message: |-
              Summary: {{ .CommonAnnotations.summary }}
              
              Hint: {{ .CommonAnnotations.hint }}

# ------------------------------------------------------------------------------
# Grafana Configuration (Default Home Dashboard & Provisioning)
# ------------------------------------------------------------------------------
grafana:
  # Sets the default home dashboard displayed upon opening the Grafana UI
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/kube_prober_dashboard.json

  # Enables sidecar auto-discovery for Grafana dashboards defined via ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL