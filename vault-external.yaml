apiVersion: v1
kind: Service
metadata:
  name: vault-dev
  namespace: default
spec:
  ports:
    - protocol: TCP
      port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vault-dev
  namespace: default
subsets:
  - addresses:
      - ip: "172.17.0.1" # Standard Docker bridge IP on Linux host
    ports:
      - port: 8200

