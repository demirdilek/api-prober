# ==============================================================================
# Production Overrides
# ==============================================================================

# Disable all mock/fault-injection targets
httpbin:
  enabled: false

# Production-grade replica counts for kube-prober engine
replicaCount: 2

# High Availability (HA) configurations
pdb:
  enabled: true
  minAvailable: 1

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

topologySpreadConstraints:
  enabled: true
  whenUnsatisfiable: DoNotSchedule