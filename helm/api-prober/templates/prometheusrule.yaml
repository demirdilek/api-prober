apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-rules
  labels:
    release: prom-stack
spec:
  groups:
    - name: api-prober-golden-signals
      rules:
        # 1. Errors: High failure rate
        - alert: HighErrorRate
          expr: increase(api_prober_errors_total[2m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: '{{`High error rate detected on target {{ $labels.target }}`}}'

        # 2. Latency: High p99 Latency
        - alert: HighLatency
          expr: api_prober_latency_seconds{quantile="0.99"} > 1.5
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: '{{`High p99 latency on target {{ $labels.target }}`}}'

        # 3. Saturation: Worker Capacity Reached
        - alert: MaxWorkersReached
          expr: api_prober_saturation_active_workers >= 10
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Worker saturation reached limits"

        # 4. Traffic: Traffic Collapse / No Probes Executing
        - alert: TrafficCollapse
          expr: rate(api_prober_traffic_total[2m]) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: '{{`Traffic collapse on target {{ $labels.target }}`}}'

